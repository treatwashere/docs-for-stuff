<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs For Stuff - React Docs</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .edit-page-nav {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .edit-page-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 50px;
      background: #1e1e1e;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .edit-page-btn:hover {
      background: #2a2a2a;
      color: rgb(255, 147, 0);
      transform: translateY(-1px);
    }

    .edit-page-btn img {
      width: 18px;
      height: 18px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="edit-page-nav">
    <a href="editpages.html" class="edit-page-btn">
      <img src="../../assets/pen-clip-white.svg" alt="">
      <span>Edit this page</span>
    </a>
  </div>
</body>
</html>
